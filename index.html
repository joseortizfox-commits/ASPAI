<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aspai</title>
<style>
  :root{
    --bg:#18120D;
    --surface:#201812;
    --surface-2:#2B2013;
    --border:#3D2E1E;
    --text:#F3E7D3;
    --text-muted:#A8977C;
    --gold:#E3A83B;
    --danger:#D9614F;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:14px;
    line-height:1.5;
  }
  h1,h2{ font-family:Georgia,"Times New Roman",serif; font-weight:400; color:var(--text); }
  h1{ font-size:22px; margin:0; }
  h2{ font-size:18px; margin:0 0 4px 0; }
  p{ margin:0 0 8px 0; }
  a{ color:var(--gold); }
  input,textarea,select{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:7px;
    padding:8px 9px;
    font-family:inherit;
    font-size:13px;
  }
  input:focus,textarea:focus,select:focus{ outline:1px solid var(--gold); }
  button{
    font-family:inherit;
    cursor:pointer;
    border-radius:7px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    padding:9px 14px;
    font-size:13px;
    font-weight:600;
    transition:border-color .15s ease, background .15s ease;
  }
  button:hover{ border-color:var(--gold); }

  #gm-app{ max-width:760px; margin:0 auto; padding-bottom:60px; }

  .gm-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px; border-bottom:1px solid var(--border);
  }
  .gm-brand{ display:flex; align-items:center; gap:12px; }
  .gm-brand svg{ width:36px; height:36px; flex:none; }
  .gm-brand-text p{ margin:2px 0 0 0; color:var(--text-muted); font-size:12px; }

  .gm-body{ padding:20px; }

  .gm-recipe-pick{ display:flex; flex-wrap:wrap; gap:8px; }
  .gm-recipe-btn{ border-radius:20px; padding:8px 15px; font-weight:600; }
  .gm-recipe-btn.active{ background:var(--gold); border-color:var(--gold); color:#18120D; }

  .gm-tabs{ overflow-x:auto; display:flex; gap:2px; padding:0 20px; border-bottom:1px solid var(--border); }
  .gm-tab{
    background:transparent; border:none; border-bottom:2px solid transparent;
    border-radius:0; padding:12px 14px; color:var(--text-muted); font-weight:600;
  }
  .gm-tab:hover{ color:var(--text); border-color:transparent; }
  .gm-tab.active{ color:var(--gold); border-bottom-color:var(--gold); }

  .gm-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:18px; margin-bottom:16px;
  }
  .gm-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .gm-sub{ color:var(--text-muted); font-size:12.5px; margin:4px 0 0 0; }

  .gm-small{ padding:8px 12px; font-size:12.5px; }
  .gm-primary{ background:var(--gold); border-color:var(--gold); color:#18120D; }
  .gm-primary:hover{ filter:brightness(1.08); }
  .gm-ghost{ background:transparent; border-color:transparent; color:var(--text-muted); padding:6px 8px; }
  .gm-ghost:hover{ color:var(--danger); border-color:transparent; }

  .gm-banner{ border-radius:8px; padding:10px 12px; font-size:13px; display:none; margin-bottom:10px; }
  .gm-banner.show{ display:block; }
  .gm-banner.warn{ background:rgba(217,97,79,.14); border:1px solid rgba(217,97,79,.4); color:#EFB3A6; }

  .gm-mono{ font-variant-numeric:tabular-nums; font-family:"SFMono-Regular",Consolas,monospace; }

  .gm-table{ width:100%; border-collapse:collapse; margin-top:6px; }
  .gm-table th{ text-align:left; color:var(--text-muted); font-weight:600; font-size:12px; padding:6px 8px; border-bottom:1px solid var(--border); }
  .gm-table td{ padding:8px 8px; border-bottom:1px solid var(--border); vertical-align:middle; }
  .gm-table tbody tr:last-child td{ border-bottom:none; }
  .gm-grams{ font-variant-numeric:tabular-nums; }
  .gm-pct{ color:var(--text-muted); font-variant-numeric:tabular-nums; }

  .gm-field{ display:flex; flex-direction:column; gap:4px; }
  .gm-field label{ font-size:12px; color:var(--text-muted); }

  .gm-pantry-row{
    display:grid; grid-template-columns:1fr 150px 12px 34px; gap:8px; align-items:center;
    padding:6px 0;
  }

  .gm-chip{
    display:inline-flex; align-items:center; gap:5px; border:1px solid; border-radius:20px;
    padding:3px 9px; font-size:11.5px; font-weight:600;
  }
  .gm-dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }

  .gm-gauge-wrap{ display:flex; align-items:center; gap:18px; }
  .gm-gauge{ position:relative; width:110px; height:110px; flex:none; }
  .gm-gauge svg{ width:100%; height:100%; }
  .gm-gauge-label{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .gm-gauge-label b{ font-size:17px; color:var(--gold); }
  .gm-gauge-label span{ font-size:10.5px; color:var(--text-muted); }

  .gm-empty{ text-align:center; padding:36px 10px; color:var(--text-muted); }
  .gm-empty svg{ width:48px; height:48px; margin-bottom:10px; }

  .gm-day-group{ margin-bottom:18px; }
  .gm-day-title{ font-family:Georgia,serif; color:var(--gold); font-size:15px; margin-bottom:8px; }

  .gm-sched-head, .gm-sched-row{
    display:grid;
    grid-template-columns: 64px 1.5fr 1.1fr 100px 150px 1.1fr 30px;
    gap:8px; align-items:center;
  }
  .gm-sched-head{ color:var(--text-muted); font-size:11.5px; padding:0 0 6px 0; }
  .gm-sched-row{ padding:6px 0; border-top:1px solid var(--border); }
  .gm-sched-row.done{ opacity:.5; }

  .gm-timer{ display:flex; align-items:center; gap:6px; }
  .gm-timer input{ width:40px; padding:6px; }
  .gm-timer-display{ font-variant-numeric:tabular-nums; font-size:13px; min-width:40px; }
  .gm-timer-display.alert{ color:var(--danger); font-weight:700; }

  @media (max-width:640px){
    .gm-sched-head, .gm-sched-row{ grid-template-columns: 56px 1fr 1fr 34px; }
    .gm-sched-cell-hide{ display:none; }
    .gm-header{ padding:14px 16px; }
    .gm-body{ padding:14px; }
  }
</style>
</head>
<body>
<div id="gm-app"></div>
<script src="app.js"></script>

</body>
</html>
